settings:

  enable-example-plugin: true

  debug-mode: false

dashboard:
  enabled: true
  bind: "127.0.0.1"
  port: 8765
  public-url: "http://localhost:8765"
  verify-timeout-seconds: 300
  session-minutes: 30

plugins:

  disabled-plugins: []

  load-order: []

performance:

  optimization-level: -1

  max-execution-time: 5000

security:

  restrict-file-access: false

  allowed-paths:
    - "plugins/MC-JS/"

plugin-browser:

  url: "https://browser.flori.tv"

  enabled: true

